name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/test_build_content.py
      - run: python3 scripts/build-content.py
      # TinaCMS build: validates tina/config.ts and regenerates
      # tina/tina-lock.json. The lock is the schema Tina Cloud reads, so a
      # stale lock (config changed, lock not regenerated) must fail here,
      # not at deploy time. --local needs no Tina Cloud credentials.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: npx tinacms build --skip-cloud-checks --local
      - name: tina lock in sync
        run: git diff --exit-code -- tina/tina-lock.json
      - name: syntax-check JavaScript
        run: |
          for f in public/assets/js/*.js worker/index.js; do
            node --check "$f" || exit 1
          done
      # The generated HTML/JS must match the committed copies; if the build
      # output drifts, the commit forgot to regenerate them.
      - name: generated files in sync
        run: git diff --exit-code -- public/index.html public/study.html public/assets/js/config.js public/assets/js/tiktok-accounts.js public/religion-of-peace-and-light/index.html public/books/the-goal-of-the-wise/index.html public/books/the-mahdis-manifesto/index.html
